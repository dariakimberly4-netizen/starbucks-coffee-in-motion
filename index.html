<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b09">
<title>Starbucks Philippines — Motion Experience</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080906;font-family:Arial,Helvetica,sans-serif}
.story-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f6f3ec;opacity:0;visibility:hidden;transition:opacity .8s ease}
.story-frame.ready{opacity:1;visibility:visible}
.entry{position:fixed;inset:0;z-index:10;overflow:hidden;cursor:pointer;outline:none;background:#080906;perspective:1200px;isolation:isolate}
.entry::before{content:"";position:absolute;inset:-8%;z-index:-2;background:url('assets/elegant-door.jpg') center/cover no-repeat;filter:blur(26px) brightness(.58) saturate(.85);transform:scale(1.14)}
.entry::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(6,8,6,.18)}
.door-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.015);transform-origin:50% 57%;will-change:transform,filter,opacity;transition:transform 1.9s cubic-bezier(.18,.75,.22,1),filter 1.9s ease,opacity 1.55s ease}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 54%,transparent 36%,rgba(0,0,0,.08) 72%,rgba(0,0,0,.25) 100%)}
.light{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 63%,rgba(255,239,202,.48),rgba(255,239,202,.10) 28%,transparent 54%);opacity:0;transform:scale(.72);transition:opacity 1.3s ease .25s,transform 1.55s cubic-bezier(.18,.75,.22,1)}
.wash{position:absolute;inset:0;background:#fff9ec;opacity:0;pointer-events:none;transition:opacity .8s ease .9s}
.entry.entering .door-photo{transform:scale(1.22) translateZ(105px);filter:brightness(1.13) saturate(1.03) blur(.7px)}
.entry.entering .light{opacity:1;transform:scale(1.14)}
.entry.entering .wash{opacity:1}
.entry.leave{animation:leave .65s ease forwards;pointer-events:none}
@keyframes leave{to{opacity:0;visibility:hidden}}
.entry:focus-visible{box-shadow:inset 0 0 0 4px rgba(255,255,255,.95)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){
  .entry::before{filter:blur(30px) brightness(.48) saturate(.9);transform:scale(1.24)}
  .door-photo{inset:0;width:100%;height:100%;object-fit:contain;object-position:center;transform:scale(1)}
  .vignette{background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 18%,transparent 80%,rgba(0,0,0,.28))}
  .entry.entering .door-photo{transform:scale(1.12) translateZ(70px)}
}
@media(max-width:420px){
  .door-photo{width:100%;height:100%;object-fit:contain;object-position:center}
}
@media(prefers-reduced-motion:reduce){.door-photo,.light,.wash,.story-frame{transition-duration:.01ms!important}.entry.entering .door-photo{transform:scale(1.02);filter:none}}
</style>
</head>
<body>
<iframe id="story" class="story-frame" src="story.html" title="Starbucks Philippines — Our Story"></iframe>
<div id="entry" class="entry" role="button" tabindex="0" aria-label="Tap anywhere or press Enter to enter the Starbucks story">
  <img class="door-photo" src="./assets/elegant-door.jpg?v=4" alt="" aria-hidden="true" decoding="sync" fetchpriority="high">
  <div class="vignette" aria-hidden="true"></div>
  <div class="light" aria-hidden="true"></div>
  <div class="wash" aria-hidden="true"></div>
  <span class="sr">Tap anywhere to enter</span>
</div>
<script>
(()=>{
 const entry=document.getElementById('entry');
 const frame=document.getElementById('story');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let started=false;
 function prepareFrame(){
  try{
   const d=frame.contentDocument;
   if(!d)return;
   const oldEntry=d.getElementById('entry');
   if(oldEntry)oldEntry.remove();
   d.body.classList.remove('locked');
   d.body.classList.add('entered');
   const target=d.getElementById('our-story');
   if(target)target.scrollIntoView({block:'start'});
  }catch(e){}
 }
 frame.addEventListener('load',prepareFrame);
 function finish(){
  prepareFrame();
  frame.classList.add('ready');
  entry.classList.add('leave');
  setTimeout(()=>entry.remove(),reduced?40:680);
 }
 function enter(){
  if(started)return;
  started=true;
  entry.classList.add('entering');
  setTimeout(finish,reduced?80:1550);
 }
 entry.addEventListener('click',enter);
 entry.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enter();}});
})();
</script>
</body>
</html>
